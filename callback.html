<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Finishing QuickBooks sign-in</title><meta name="robots" content="noindex"><meta name="referrer" content="no-referrer"><style>:root{--bg:#f7f7f5;--ink:#1d2320;--muted:#5d6661;--line:#e2e5e1;--accent:#1f6f4a;--panel:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#141716;--ink:#e8ebe9;--muted:#a3aca7;--line:#2c312e;--accent:#6cc79a;--panel:#1b1f1d}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
main{max-width:720px;margin:0 auto;padding:40px 16px 64px}h1{font-size:28px;line-height:1.25;margin:0 0 6px}h2{font-size:17px;margin:26px 0 6px}
p,li{color:var(--ink)}.sub{color:var(--muted);font-size:14px}a{color:var(--accent)}nav{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px;margin-bottom:28px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.btn{display:inline-block;background:var(--accent);color:#fff;text-decoration:none;padding:10px 18px;border-radius:8px;font-weight:600}
@media (prefers-color-scheme:dark){.btn{color:#0d1411}}.box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin:18px 0}</style>
<script>
// Intuit sends the sign-in result here (https is required for production). Hand it straight to the
// portal running on this computer. replace() keeps this address, with its one-time code, out of history.
(function () {
  var q = location.search;
  if (/[?&](code|error|state)=/.test(q)) location.replace('http://localhost:3000/callback' + q);
})();
</script></head>
<body><main>
<h1>Finishing QuickBooks sign-in…</h1>
<p>Sending you back to the QBO Coding Portal on this computer.</p>
<p class="sub">If nothing happens, the portal may not be running. Start it on the church's finance computer, then <a href="connect.html">connect again</a>.</p>
</main></body></html>
